name: dotnet test macOS Catalyst
description: Run device tests on macOS Catalyst via dotnet test

inputs:
  test-project:
    description: Path to the test project
    required: false
    default: LogViewer.DeviceTests/LogViewer.DeviceTests.csproj
  target-framework:
    description: Target framework
    required: false
    default: net10.0-maccatalyst
  runtime-identifier:
    description: Runtime identifier
    required: false
    default: maccatalyst-x64
  configuration:
    description: Build configuration
    required: false
    default: Release
  artifact-name:
    description: Artifact name
    required: false
    default: Test Results (dotnet test) - macOS Catalyst

runs:
  using: composite
  steps:
    - name: Setup Required Tools
      uses: ./.github/workflows/setup-tools

    - name: Run Tests
      shell: bash
      run: |
        dotnet test ${{ inputs.test-project }} \
          -f ${{ inputs.target-framework }} \
          -r ${{ inputs.runtime-identifier }} \
          -c ${{ inputs.configuration }} \
          -p:IsCI=true \
          --filter "Category!=ExpectedFailure" \
          --logger "trx;LogFileName=test-results.trx" \
          --results-directory ./artifacts/test-results \
          /bl:./artifacts/logs/msbuild-test.binlog

    - name: Clean up build artifacts before upload
      if: always()
      shell: bash
      run: |
        rm -rf ./artifacts/bin
        rm -rf ./artifacts/obj

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ./artifacts
