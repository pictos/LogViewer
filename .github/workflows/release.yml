name: Release

on:
  release:
    types:
      - published
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CONFIGURATION: Release
  APP_PROJECT: LogViewer/LogViewer.csproj
  WINDOWS_TFM: net10.0-windows10.0.19041.0
  MACCATALYST_TFM: net10.0-maccatalyst

jobs:
  publish-windows:
    name: Publish Windows
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: battila7/get-version-action@v2

      - name: Set app version from tag
        if: steps.get_version.outputs.version-without-v != ''
        shell: pwsh
        run: |
          $version = '${{ steps.get_version.outputs.version-without-v }}'
          $constantsFile = Join-Path $env:GITHUB_WORKSPACE 'LogViewer/Contants.cs'
          $content = Get-Content -Raw $constantsFile
          $content = $content -replace '(public const string Versino\s*=\s*)".*?";', "`$1`"$version`";"
          $content = $content -replace '(public const string Version\s*=\s*)".*?";', "`$1`"$version`";"
          Set-Content -Path $constantsFile -Value $content -Encoding utf8

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Install MAUI workload
        shell: pwsh
        run: dotnet workload install maui --source https://api.nuget.org/v3/index.json

      - name: Restore
        shell: pwsh
        run: dotnet restore .\LogViewer.slnx

      - name: Publish app
        shell: pwsh
        run: |
          dotnet publish $env:APP_PROJECT `
            -c $env:CONFIGURATION `
            -f $env:WINDOWS_TFM `
            -r win10-x64 `
            -p:WindowsPackageType=None `
            --output .\artifacts\publish\windows

      - name: Create unpackaged installer archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\installers | Out-Null
          Compress-Archive `
            -Path .\artifacts\publish\windows\* `
            -DestinationPath .\artifacts\installers\LogViewer-windows-win10-x64-unpackaged.zip `
            -Force

      - name: Upload unpackaged installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogViewer-windows-win10-x64-unpackaged
          path: .\artifacts\installers\LogViewer-windows-win10-x64-unpackaged.zip

      - name: Publish MSIX package (unsigned)
        shell: pwsh
        run: |
          dotnet publish $env:APP_PROJECT `
            -c $env:CONFIGURATION `
            -f $env:WINDOWS_TFM `
            -r win10-x64 `
            -p:WindowsPackageType=MSIX `
            -p:GenerateAppxPackageOnBuild=true `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxPackageSigningEnabled=false `
            --output .\artifacts\publish\windows-msix

      - name: Create packaged installer archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\installers | Out-Null
          Compress-Archive `
            -Path .\artifacts\publish\windows-msix\* `
            -DestinationPath .\artifacts\installers\LogViewer-windows-win10-x64-msix-unsigned.zip `
            -Force

      - name: Upload packaged installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogViewer-windows-win10-x64-msix-unsigned
          path: .\artifacts\installers\LogViewer-windows-win10-x64-msix-unsigned.zip

  publish-maccatalyst:
    name: Publish Mac Catalyst
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: battila7/get-version-action@v2

      - name: Set app version from tag
        if: steps.get_version.outputs.version-without-v != ''
        shell: pwsh
        run: |
          $version = '${{ steps.get_version.outputs.version-without-v }}'
          $constantsFile = Join-Path $env:GITHUB_WORKSPACE 'LogViewer/Contants.cs'
          $content = Get-Content -Raw $constantsFile
          $content = $content -replace '(public const string Versino\s*=\s*)".*?";', "`$1`"$version`";"
          $content = $content -replace '(public const string Version\s*=\s*)".*?";', "`$1`"$version`";"
          Set-Content -Path $constantsFile -Value $content -Encoding utf8

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Install MAUI workload
        shell: pwsh
        run: dotnet workload install maui --source https://api.nuget.org/v3/index.json

      - name: Restore
        shell: pwsh
        run: dotnet restore ./LogViewer.slnx

      - name: Publish app
        shell: pwsh
        run: |
          dotnet publish $env:APP_PROJECT `
            -c $env:CONFIGURATION `
            -f $env:MACCATALYST_TFM `
            -r maccatalyst-x64 `
            -p:EnableCodeSigning=false `
            --output ./artifacts/publish/maccatalyst

      - name: Create installer archive
        shell: bash
        run: |
          mkdir -p ./artifacts/installers
          cd ./artifacts/publish/maccatalyst
          zip -r ../../installers/LogViewer-maccatalyst-x64.zip .

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogViewer-maccatalyst-x64
          path: ./artifacts/installers/LogViewer-maccatalyst-x64.zip

  upload-release-assets:
    name: Upload assets to GitHub release
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs:
      - publish-windows
      - publish-maccatalyst

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: LogViewer-windows-win10-x64-unpackaged
          path: ./artifacts/release

      - name: Download Windows MSIX installer
        uses: actions/download-artifact@v4
        with:
          name: LogViewer-windows-win10-x64-msix-unsigned
          path: ./artifacts/release

      - name: Download Mac Catalyst installer
        uses: actions/download-artifact@v4
        with:
          name: LogViewer-maccatalyst-x64
          path: ./artifacts/release

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/release/LogViewer-windows-win10-x64-unpackaged.zip
            ./artifacts/release/LogViewer-windows-win10-x64-msix-unsigned.zip
            ./artifacts/release/LogViewer-maccatalyst-x64.zip
