name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CONFIGURATION: Release
  APP_PROJECT: LogViewer/LogViewer.csproj
  WINDOWS_TFM: net10.0-windows10.0.19041.0
  MACCATALYST_TFM: net10.0-maccatalyst

jobs:
  publish-windows:
    name: Publish Windows
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: battila7/get-version-action@v2

      - name: Set app version from tag
        if: steps.get_version.outputs.version-without-v != ''
        shell: pwsh
        run: |
          $version = '${{ steps.get_version.outputs.version-without-v }}'
          $constantsFile = Join-Path $env:GITHUB_WORKSPACE 'LogViewer/Contants.cs'
          $content = Get-Content -Raw $constantsFile
          $content = $content -replace '(public const string Versino\s*=\s*)".*?";', "`$1`"$version`";"
          $content = $content -replace '(public const string Version\s*=\s*)".*?";', "`$1`"$version`";"
          Set-Content -Path $constantsFile -Value $content -Encoding utf8

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Install MAUI workload
        shell: pwsh
        run: dotnet workload install maui --source https://api.nuget.org/v3/index.json

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:APP_PROJECT

      - name: Setup Windows App CLI
        uses: microsoft/setup-WinAppCli@v0.1

      - name: Validate signing secrets and restore PFX
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGN_PFX_BASE64)) {
            Write-Error "SIGN_PFX_BASE64 secret is not set. Add it under repository/organization secrets (see README)."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGN_PFX_PASSWORD)) {
            Write-Error "SIGN_PFX_PASSWORD secret is not set. Add it under repository/organization secrets (see README)."
            exit 1
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          $bytes = [System.Convert]::FromBase64String($env:SIGN_PFX_BASE64)
          [System.IO.File]::WriteAllBytes($pfxPath, $bytes)
          "SIGN_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Restored signing PFX to $pfxPath ($($bytes.Length) bytes)"

      - name: Publish app
        shell: pwsh
        run: |
          dotnet publish $env:APP_PROJECT `
            -c $env:CONFIGURATION `
            -f $env:WINDOWS_TFM `
            -r win-x64 `
            -p:SelfContained=true `
            -p:WindowsAppSDKSelfContained=true `
            -p:WindowsPackageType=None `
            --output .\artifacts\publish\windows

      - name: Sign unpackaged binaries (x64)
        shell: pwsh
        env:
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $files = Get-ChildItem -Path .\artifacts\publish\windows -Recurse -File | Where-Object { $_.Extension -ieq '.exe' }
          if (-not $files) { Write-Error "No .exe files found in x64 publish output to sign"; exit 1 }
          foreach ($file in $files) {
            Write-Host "Signing $($file.FullName)"
            winapp sign $file.FullName $env:SIGN_PFX_PATH --password $env:SIGN_PFX_PASSWORD
            if ($LASTEXITCODE -ne 0) { Write-Error "Failed signing $($file.FullName)"; exit 1 }
          }

      - name: Create unpackaged installer archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\installers | Out-Null
          Compress-Archive `
            -Path .\artifacts\publish\windows\* `
            -DestinationPath .\artifacts\installers\LogViewer-windows-win10-x64-unpackaged.zip `
            -Force

      - name: Upload unpackaged installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogViewer-windows-win10-x64-unpackaged
          path: .\artifacts\installers\LogViewer-windows-win10-x64-unpackaged.zip

      - name: Publish app (arm64)
        shell: pwsh
        run: |
          dotnet publish $env:APP_PROJECT `
            -c $env:CONFIGURATION `
            -f $env:WINDOWS_TFM `
            -r win-arm64 `
            -p:SelfContained=true `
            -p:WindowsAppSDKSelfContained=true `
            -p:WindowsPackageType=None `
            --output .\artifacts\publish\windows-arm64

      - name: Sign unpackaged binaries (arm64)
        shell: pwsh
        env:
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $files = Get-ChildItem -Path .\artifacts\publish\windows-arm64 -Recurse -File | Where-Object { $_.Extension -ieq '.exe' }
          if (-not $files) { Write-Error "No .exe files found in arm64 publish output to sign"; exit 1 }
          foreach ($file in $files) {
            Write-Host "Signing $($file.FullName)"
            winapp sign $file.FullName $env:SIGN_PFX_PATH --password $env:SIGN_PFX_PASSWORD
            if ($LASTEXITCODE -ne 0) { Write-Error "Failed signing $($file.FullName)"; exit 1 }
          }

      - name: Create unpackaged installer archive (arm64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\installers | Out-Null
          Compress-Archive `
            -Path .\artifacts\publish\windows-arm64\* `
            -DestinationPath .\artifacts\installers\LogViewer-windows-win10-arm64-unpackaged.zip `
            -Force

      - name: Upload unpackaged installer artifact (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: LogViewer-windows-win10-arm64-unpackaged
          path: .\artifacts\installers\LogViewer-windows-win10-arm64-unpackaged.zip

      # --- Signed MSIX packaging via the Windows App Development CLI ---
      # The unpackaged ZIPs above are self-contained loose builds whose .exe
      # files are signed with `winapp sign`. Below we also produce signed MSIX
      # packages from those same publish outputs using `winapp pack`.
      #
      # The checked-in MAUI source Package.appxmanifest
      # (LogViewer/Platforms/Windows/Package.appxmanifest) still contains
      # unresolved MAUI `$placeholder$` tokens (DisplayName, Logo, Identity
      # Name, tile/splash images). WinAppCLI only auto-resolves
      # `$targetnametoken$` / `$targetentrypoint$`, so packing that source
      # manifest fails with
      # "The manifest contains unresolved placeholders: $placeholder$".
      #
      # MAUI's resizetizer resolves those tokens at BUILD time and emits a
      # fully-resolved manifest under
      # obj/<Config>/<TFM>/<RID>/resizetizer/m/Package.appxmanifest. Each
      # `dotnet publish ... -r <rid> ... WindowsPackageType=None` step above
      # regenerates that RID's resolved manifest, so we simply point
      # `winapp pack --manifest` at it (per RID). We must NOT edit the MAUI
      # source manifest. Only `$targetnametoken$` / `$targetentrypoint$`
      # remain in the resolved manifest, which `--executable LogViewer.exe`
      # resolves.

      - name: Pack signed MSIX (x64)
        shell: pwsh
        env:
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\installers | Out-Null
          $target = '.\artifacts\installers\LogViewer-windows-win10-x64-signed.msix'
          # Use the resizetizer-resolved manifest for the win-x64 RID, produced
          # by the "Publish app" step above.
          $manifest = ".\LogViewer\obj\$env:CONFIGURATION\$env:WINDOWS_TFM\win-x64\resizetizer\m\Package.appxmanifest"
          if (-not (Test-Path $manifest)) {
            Write-Error "Resolved MSIX manifest not found at $manifest. Ensure the win-x64 publish step ran before packing."
            exit 1
          }
          # The publish output contains multiple .exe files (LogViewer.exe and
          # RestartAgent.exe), so pin the app entrypoint with --executable.
          winapp pack .\artifacts\publish\windows `
            --manifest $manifest `
            --executable LogViewer.exe `
            --cert $env:SIGN_PFX_PATH `
            --cert-password $env:SIGN_PFX_PASSWORD `
            --output $target
          if ($LASTEXITCODE -ne 0) { Write-Error "winapp pack failed for x64"; exit 1 }
          if (-not (Test-Path $target)) { Write-Error "No signed .msix produced for x64"; exit 1 }

      - name: Upload signed MSIX artifact (x64)
        uses: actions/upload-artifact@v4
        with:
          name: LogViewer-windows-win10-x64-msix-signed
          path: .\artifacts\installers\LogViewer-windows-win10-x64-signed.msix

      - name: Pack signed MSIX (arm64)
        shell: pwsh
        env:
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\installers | Out-Null
          $target = '.\artifacts\installers\LogViewer-windows-win10-arm64-signed.msix'
          # Use the resizetizer-resolved manifest for the win-arm64 RID,
          # produced by the "Publish app (arm64)" step above.
          $manifest = ".\LogViewer\obj\$env:CONFIGURATION\$env:WINDOWS_TFM\win-arm64\resizetizer\m\Package.appxmanifest"
          if (-not (Test-Path $manifest)) {
            Write-Error "Resolved MSIX manifest not found at $manifest. Ensure the win-arm64 publish step ran before packing."
            exit 1
          }
          winapp pack .\artifacts\publish\windows-arm64 `
            --manifest $manifest `
            --executable LogViewer.exe `
            --cert $env:SIGN_PFX_PATH `
            --cert-password $env:SIGN_PFX_PASSWORD `
            --output $target
          if ($LASTEXITCODE -ne 0) { Write-Error "winapp pack failed for arm64"; exit 1 }
          if (-not (Test-Path $target)) { Write-Error "No signed .msix produced for arm64"; exit 1 }

      - name: Upload signed MSIX artifact (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: LogViewer-windows-win10-arm64-msix-signed
          path: .\artifacts\installers\LogViewer-windows-win10-arm64-signed.msix

  publish-maccatalyst:
    name: Publish Mac Catalyst (${{ matrix.arch }})
    # macos-26 ships Xcode 26.5 (default), matching the Mac Catalyst band
    # bundled with the .NET 10 SDK. See ci.yml for details.
    runs-on: macos-26

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rid: maccatalyst-arm64
          - arch: x64
            rid: maccatalyst-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: battila7/get-version-action@v2

      - name: Set app version from tag
        if: steps.get_version.outputs.version-without-v != ''
        shell: pwsh
        run: |
          $version = '${{ steps.get_version.outputs.version-without-v }}'
          $constantsFile = Join-Path $env:GITHUB_WORKSPACE 'LogViewer/Contants.cs'
          $content = Get-Content -Raw $constantsFile
          $content = $content -replace '(public const string Versino\s*=\s*)".*?";', "`$1`"$version`";"
          $content = $content -replace '(public const string Version\s*=\s*)".*?";', "`$1`"$version`";"
          Set-Content -Path $constantsFile -Value $content -Encoding utf8

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Install MAUI workload
        shell: pwsh
        run: dotnet workload install maui --source https://api.nuget.org/v3/index.json

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:APP_PROJECT

      - name: Publish app
        shell: bash
        run: |
          dotnet publish "$APP_PROJECT" \
            -c "$CONFIGURATION" \
            -f "$MACCATALYST_TFM" \
            -r ${{ matrix.rid }} \
            -p:EnableCodeSigning=false \
            -p:CreatePackage=false \
            --output ./artifacts/publish/maccatalyst-${{ matrix.arch }}

      # No paid Apple Developer account is available, so the .app bundle is
      # unsigned and not notarized. macOS Gatekeeper will show an
      # "unidentified developer" prompt; users must right-click > Open (or
      # allow it under System Settings > Privacy & Security) the first time.
      - name: Create DMG installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./artifacts/installers

          # The Mac Catalyst .app bundle is emitted to the project's bin output
          # (bin/Release/net10.0-maccatalyst/<rid>/), not to the publish
          # --output directory, so search both locations for it.
          app_path="$(find \
            ./artifacts/publish/maccatalyst-${{ matrix.arch }} \
            ./LogViewer/bin/${CONFIGURATION}/${MACCATALYST_TFM}/${{ matrix.rid }} \
            -maxdepth 1 -name '*.app' 2>/dev/null | head -n 1)"
          if [ -z "$app_path" ]; then
            echo "No .app bundle found in publish output" >&2
            echo "--- publish output ---" >&2
            ls -la ./artifacts/publish/maccatalyst-${{ matrix.arch }} >&2 || true
            echo "--- bin output ---" >&2
            ls -la "./LogViewer/bin/${CONFIGURATION}/${MACCATALYST_TFM}/${{ matrix.rid }}" >&2 || true
            exit 1
          fi
          echo "Found app bundle: $app_path"

          staging="$(mktemp -d)"
          cp -R "$app_path" "$staging/"
          ln -s /Applications "$staging/Applications"

          hdiutil create \
            -volname "LogViewer" \
            -srcfolder "$staging" \
            -ov \
            -format UDZO \
            ./artifacts/installers/LogViewer-maccatalyst-${{ matrix.arch }}.dmg

          rm -rf "$staging"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogViewer-maccatalyst-${{ matrix.arch }}
          path: ./artifacts/installers/LogViewer-maccatalyst-${{ matrix.arch }}.dmg

  upload-release-assets:
    name: Upload assets to GitHub release
    runs-on: ubuntu-latest
    # Windows is the priority target: the release must go out as long as the
    # Windows build succeeds. The macOS job is best-effort, so we only require
    # publish-windows and let the macOS DMG downloads below be optional.
    if: github.event_name == 'release' && always() && needs.publish-windows.result == 'success'
    needs:
      - publish-windows
      - publish-maccatalyst

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: LogViewer-windows-win10-x64-unpackaged
          path: ./artifacts/release

      - name: Download Windows MSIX installer
        uses: actions/download-artifact@v4
        with:
          name: LogViewer-windows-win10-x64-msix-signed
          path: ./artifacts/release

      - name: Download Windows arm64 installer
        uses: actions/download-artifact@v4
        with:
          name: LogViewer-windows-win10-arm64-unpackaged
          path: ./artifacts/release

      - name: Download Windows arm64 MSIX installer
        uses: actions/download-artifact@v4
        with:
          name: LogViewer-windows-win10-arm64-msix-signed
          path: ./artifacts/release

      - name: Download macOS arm64 DMG
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: LogViewer-maccatalyst-arm64
          path: ./artifacts/release

      - name: Download macOS x64 DMG
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: LogViewer-maccatalyst-x64
          path: ./artifacts/release

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          # fail_on_unmatched_files defaults to false, so any macOS DMG that
          # was not produced (because the macOS job failed) is simply skipped.
          files: |
            ./artifacts/release/LogViewer-windows-win10-x64-unpackaged.zip
            ./artifacts/release/LogViewer-windows-win10-x64-signed.msix
            ./artifacts/release/LogViewer-windows-win10-arm64-unpackaged.zip
            ./artifacts/release/LogViewer-windows-win10-arm64-signed.msix
            ./artifacts/release/LogViewer-maccatalyst-arm64.dmg
            ./artifacts/release/LogViewer-maccatalyst-x64.dmg
