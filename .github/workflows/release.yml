name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CONFIGURATION: Release
  APP_PROJECT: LogViewer/LogViewer.csproj
  WINDOWS_TFM: net10.0-windows10.0.19041.0
  MACCATALYST_TFM: net10.0-maccatalyst

jobs:
  publish-windows:
    name: Publish Windows
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: battila7/get-version-action@v2

      - name: Set app version from tag
        if: steps.get_version.outputs.version-without-v != ''
        shell: pwsh
        run: |
          $version = '${{ steps.get_version.outputs.version-without-v }}'
          $constantsFile = Join-Path $env:GITHUB_WORKSPACE 'LogViewer/Contants.cs'
          $content = Get-Content -Raw $constantsFile
          $content = $content -replace '(public const string Versino\s*=\s*)".*?";', "`$1`"$version`";"
          $content = $content -replace '(public const string Version\s*=\s*)".*?";', "`$1`"$version`";"
          Set-Content -Path $constantsFile -Value $content -Encoding utf8

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Install MAUI workload
        shell: pwsh
        run: dotnet workload install maui --source https://api.nuget.org/v3/index.json

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:APP_PROJECT

      - name: Publish app
        shell: pwsh
        run: |
          dotnet publish $env:APP_PROJECT `
            -c $env:CONFIGURATION `
            -f $env:WINDOWS_TFM `
            -r win-x64 `
            -p:WindowsPackageType=None `
            --output .\artifacts\publish\windows

      - name: Create unpackaged installer archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\installers | Out-Null
          Compress-Archive `
            -Path .\artifacts\publish\windows\* `
            -DestinationPath .\artifacts\installers\LogViewer-windows-win10-x64-unpackaged.zip `
            -Force

      - name: Upload unpackaged installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogViewer-windows-win10-x64-unpackaged
          path: .\artifacts\installers\LogViewer-windows-win10-x64-unpackaged.zip

      - name: Publish app (arm64)
        shell: pwsh
        run: |
          dotnet publish $env:APP_PROJECT `
            -c $env:CONFIGURATION `
            -f $env:WINDOWS_TFM `
            -r win-arm64 `
            -p:WindowsPackageType=None `
            --output .\artifacts\publish\windows-arm64

      - name: Create unpackaged installer archive (arm64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\installers | Out-Null
          Compress-Archive `
            -Path .\artifacts\publish\windows-arm64\* `
            -DestinationPath .\artifacts\installers\LogViewer-windows-win10-arm64-unpackaged.zip `
            -Force

      - name: Upload unpackaged installer artifact (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: LogViewer-windows-win10-arm64-unpackaged
          path: .\artifacts\installers\LogViewer-windows-win10-arm64-unpackaged.zip

      - name: Publish MSIX package (unsigned)
        shell: pwsh
        run: |
          dotnet publish $env:APP_PROJECT `
            -c $env:CONFIGURATION `
            -f $env:WINDOWS_TFM `
            -r win-x64 `
            -p:WindowsPackageType=MSIX `
            -p:GenerateAppxPackageOnBuild=true `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxPackageSigningEnabled=false `
            --output .\artifacts\publish\windows-msix

      - name: Collect MSIX installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\installers | Out-Null
          $msix = Get-ChildItem -Path .\LogViewer\AppPackages -Filter LogViewer_*.msix -Recurse | Select-Object -First 1
          if (-not $msix) { Write-Error "No LogViewer .msix found in LogViewer\AppPackages"; exit 1 }
          Copy-Item $msix.FullName .\artifacts\installers\LogViewer-windows-win10-x64-unsigned.msix

      - name: Upload MSIX installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogViewer-windows-win10-x64-msix-unsigned
          path: .\artifacts\installers\LogViewer-windows-win10-x64-unsigned.msix

      - name: Clean AppPackages before arm64 build
        shell: pwsh
        run: |
          if (Test-Path .\LogViewer\AppPackages) { Remove-Item -Recurse -Force .\LogViewer\AppPackages }

      - name: Publish MSIX package (arm64, unsigned)
        shell: pwsh
        run: |
          dotnet publish $env:APP_PROJECT `
            -c $env:CONFIGURATION `
            -f $env:WINDOWS_TFM `
            -r win-arm64 `
            -p:WindowsPackageType=MSIX `
            -p:GenerateAppxPackageOnBuild=true `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxPackageSigningEnabled=false `
            --output .\artifacts\publish\windows-msix-arm64

      - name: Collect MSIX installer (arm64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\installers | Out-Null
          $msix = Get-ChildItem -Path .\LogViewer\AppPackages -Filter LogViewer_*.msix -Recurse | Select-Object -First 1
          if (-not $msix) { Write-Error "No LogViewer .msix found in LogViewer\AppPackages"; exit 1 }
          Copy-Item $msix.FullName .\artifacts\installers\LogViewer-windows-win10-arm64-unsigned.msix

      - name: Upload MSIX installer artifact (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: LogViewer-windows-win10-arm64-msix-unsigned
          path: .\artifacts\installers\LogViewer-windows-win10-arm64-unsigned.msix

  publish-maccatalyst:
    name: Publish Mac Catalyst (${{ matrix.arch }})
    # macos-26 ships Xcode 26.5 (default), matching the Mac Catalyst band
    # bundled with the .NET 10 SDK. See ci.yml for details.
    runs-on: macos-26

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rid: maccatalyst-arm64
          - arch: x64
            rid: maccatalyst-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: battila7/get-version-action@v2

      - name: Set app version from tag
        if: steps.get_version.outputs.version-without-v != ''
        shell: pwsh
        run: |
          $version = '${{ steps.get_version.outputs.version-without-v }}'
          $constantsFile = Join-Path $env:GITHUB_WORKSPACE 'LogViewer/Contants.cs'
          $content = Get-Content -Raw $constantsFile
          $content = $content -replace '(public const string Versino\s*=\s*)".*?";', "`$1`"$version`";"
          $content = $content -replace '(public const string Version\s*=\s*)".*?";', "`$1`"$version`";"
          Set-Content -Path $constantsFile -Value $content -Encoding utf8

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Install MAUI workload
        shell: pwsh
        run: dotnet workload install maui --source https://api.nuget.org/v3/index.json

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:APP_PROJECT

      - name: Publish app
        shell: bash
        run: |
          dotnet publish "$APP_PROJECT" \
            -c "$CONFIGURATION" \
            -f "$MACCATALYST_TFM" \
            -r ${{ matrix.rid }} \
            -p:EnableCodeSigning=false \
            -p:CreatePackage=false \
            --output ./artifacts/publish/maccatalyst-${{ matrix.arch }}

      # No paid Apple Developer account is available, so the .app bundle is
      # unsigned and not notarized. macOS Gatekeeper will show an
      # "unidentified developer" prompt; users must right-click > Open (or
      # allow it under System Settings > Privacy & Security) the first time.
      - name: Create DMG installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./artifacts/installers
          app_path="$(find ./artifacts/publish/maccatalyst-${{ matrix.arch }} -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$app_path" ]; then
            echo "No .app bundle found in publish output" >&2
            ls -la ./artifacts/publish/maccatalyst-${{ matrix.arch }} >&2
            exit 1
          fi
          echo "Found app bundle: $app_path"

          staging="$(mktemp -d)"
          cp -R "$app_path" "$staging/"
          ln -s /Applications "$staging/Applications"

          hdiutil create \
            -volname "LogViewer" \
            -srcfolder "$staging" \
            -ov \
            -format UDZO \
            ./artifacts/installers/LogViewer-maccatalyst-${{ matrix.arch }}.dmg

          rm -rf "$staging"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogViewer-maccatalyst-${{ matrix.arch }}
          path: ./artifacts/installers/LogViewer-maccatalyst-${{ matrix.arch }}.dmg

  upload-release-assets:
    name: Upload assets to GitHub release
    runs-on: ubuntu-latest
    # Windows is the priority target: the release must go out as long as the
    # Windows build succeeds. The macOS job is best-effort, so we only require
    # publish-windows and let the macOS DMG downloads below be optional.
    if: github.event_name == 'release' && always() && needs.publish-windows.result == 'success'
    needs:
      - publish-windows
      - publish-maccatalyst

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: LogViewer-windows-win10-x64-unpackaged
          path: ./artifacts/release

      - name: Download Windows MSIX installer
        uses: actions/download-artifact@v4
        with:
          name: LogViewer-windows-win10-x64-msix-unsigned
          path: ./artifacts/release

      - name: Download Windows arm64 installer
        uses: actions/download-artifact@v4
        with:
          name: LogViewer-windows-win10-arm64-unpackaged
          path: ./artifacts/release

      - name: Download Windows arm64 MSIX installer
        uses: actions/download-artifact@v4
        with:
          name: LogViewer-windows-win10-arm64-msix-unsigned
          path: ./artifacts/release

      - name: Download macOS arm64 DMG
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: LogViewer-maccatalyst-arm64
          path: ./artifacts/release

      - name: Download macOS x64 DMG
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: LogViewer-maccatalyst-x64
          path: ./artifacts/release

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          # fail_on_unmatched_files defaults to false, so any macOS DMG that
          # was not produced (because the macOS job failed) is simply skipped.
          files: |
            ./artifacts/release/LogViewer-windows-win10-x64-unpackaged.zip
            ./artifacts/release/LogViewer-windows-win10-x64-unsigned.msix
            ./artifacts/release/LogViewer-windows-win10-arm64-unpackaged.zip
            ./artifacts/release/LogViewer-windows-win10-arm64-unsigned.msix
            ./artifacts/release/LogViewer-maccatalyst-arm64.dmg
            ./artifacts/release/LogViewer-maccatalyst-x64.dmg
