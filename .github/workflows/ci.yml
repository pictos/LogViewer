name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build, test and package (Windows)
    runs-on: windows-2025

    env:
      CONFIGURATION: Release
      TEST_PROJECT: LogViewer.DeviceTests\LogViewer.DeviceTests.csproj
      APP_PROJECT: LogViewer\LogViewer.csproj
      WINDOWS_TFM: net10.0-windows10.0.19041.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup tools
        uses: ./.github/workflows/setup-tools

      - name: Restore
        shell: pwsh
        run: dotnet restore .\LogViewer.slnx

      - name: 1) Build DeviceTests
        shell: pwsh
        run: |
          dotnet build $env:TEST_PROJECT `
            -c $env:CONFIGURATION `
            -f $env:WINDOWS_TFM `
            /bl:.\artifacts\logs\msbuild-build-devicetests.binlog

      - name: 2) Run tests
        uses: ./.github/workflows/test-dotnet-test-windows
        with:
          test-project: LogViewer.DeviceTests\LogViewer.DeviceTests.csproj
          target-framework: net10.0-windows10.0.19041.0
          configuration: Release
          artifact-name: Test Results (dotnet test) - Windows

      - name: 3) Build LogViewer
        shell: pwsh
        run: |
          dotnet build $env:APP_PROJECT `
            -c $env:CONFIGURATION `
            -f $env:WINDOWS_TFM `
            /bl:.\artifacts\logs\msbuild-build-logviewer.binlog

      - name: 4) Publish package for PR artifacts
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          dotnet publish $env:APP_PROJECT `
            -c $env:CONFIGURATION `
            -f $env:WINDOWS_TFM `
            -r win-x64 `
            -p:WindowsPackageType=None `
            --output .\artifacts\package\LogViewer

      - name: Upload package artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: LogViewer-Windows-Package
          path: .\artifacts\package

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: .\artifacts\logs
